<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="stylesheet" th:href="@{/connexion.css}">
</head>
<body>
    <header>
        <a th:href="@{/}">Acceuil</a>
    </header>
    <h1> Connexion de votre compte.</h1>
    <div th:if="${error}" th:text="${error}" style="background: darkred; color:white; text-align: center; font-size: 30px; padding: 1em;"></div>
    
    <form th:action="@{/formConnexion}" method="POST" class="form-connexion">
        <div>
            <label for="email">email</label>
            <input type="email" id="email" name="email">
        </div>
        <div>
            <label for="mdp">mot de passe</label>
            <input type="password" id="mdp" name="mdp">
        </div>
        
        <button type="submit">Connexion</button>
    </form>
