<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"> 
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Validation</title>
    </head>
    <body>
        <h1>Validation</h1>
        <p>
            Vérifiez, validez et complétez les informations du logement : 
            <strong th:text="${logement['nom'] ?: 'Nom non détecté'}"></strong>
        </p>

        <!-- Affichage temporaire de toute la Map pour vérifier ce que Flask renvoie -->
        <p style="color: gray; font-size: 0.9em;">
            Données reçues : <span th:text="${logement}"></span>
        </p>

        <!-- Formulaire -->
        <form action="." method="post"> 
        </form>
    </body>
</html>
