<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"> 
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Validation</title>
    </head>
    <body>
        <h1>Validation</h1>
        <p>
            Vérifiez, validez et complétez les informations du logement.
        </p>

        <!-- Formulaire -->
         <form action="."  method="post">
            <label for="name">Nom :</label>
            <input type="text" id="name" name="user_name" th:value="${logement.nom}"/>  
         </form>
    </body>
</html>
